name: Robot Descargador

on:
  workflow_dispatch: # Permite darle al botón de "Run" a mano
  schedule:
    - cron: '0 8 * * *' # Se ejecuta todos los días a las 8 AM

jobs:
  descarga:
    runs-on: ubuntu-latest
    # AÑADE ESTAS DOS LÍNEAS AQUÍ:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout de la carpeta
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar librerias
        run: |
          pip install requests pandas

      - name: Ejecutar script de descarga
        run: |
          python script_descarga.py

      - name: Guardar y subir cambios
        run: |
          git config --global user.name 'Robot-Sonometros'
          git config --global user.email 'robot@github.com'
          git add datos_sonometros.csv
          git commit -m "Datos actualizados automáticamente" || exit 0
          git push
